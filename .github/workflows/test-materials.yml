name: Test materials

on:
  push:
  pull_request:

jobs:
  materials:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studygo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studygo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run materials unit tests
        run: npm run test:materials
